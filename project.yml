name: DailyList
options:
  bundleIdPrefix: com.ls
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Manual
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""

targets:
  DailyList:
    type: application
    platform: iOS
    sources:
      - path: App/Sources
      - path: App/Resources
      - path: Shared
    dependencies:
      - target: DailyListWidget
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: DailyList
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "2"
        LSRequiresIPhoneOS: true
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    entitlements:
      path: App/DailyList.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ls.dailylist.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ls.dailylist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CURRENT_PROJECT_VERSION: "2"
        MARKETING_VERSION: "1.1"

  DailyListWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget/Sources
      - path: Shared
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: DailyListWidget
        CFBundleShortVersionString: "1.1"
        CFBundleVersion: "2"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: Widget/DailyListWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.ls.dailylist.shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.ls.dailylist.widget
        SKIP_INSTALL: "YES"
        CURRENT_PROJECT_VERSION: "2"
        MARKETING_VERSION: "1.1"

schemes:
  DailyList:
    build:
      targets:
        DailyList: all
    run:
      config: Debug
    archive:
      config: Release
